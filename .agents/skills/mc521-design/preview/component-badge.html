<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Badge - 君庭阁</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    /* Page scaffold — NOT extracted */
    body { margin: 0; padding: 12px; background: var(--color-background); font-family: var(--font-family-base); color: var(--color-on-surface); }
    .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
    .label { width: 92px; flex-shrink: 0; font-size: var(--font-size-caption); color: var(--color-muted-foreground); text-transform: uppercase; letter-spacing: 0.05em; }
    .divider { border: none; border-top: 1px solid var(--color-border); margin: 8px 0; }

    /* @component-css-start */
    /* Component definitions — extracted to components.css by deterministic script */
    .badge { display: inline-flex; align-items: center; gap: var(--space-1); white-space: nowrap; font-size: var(--font-size-caption); line-height: var(--line-height-caption); flex-shrink: 0; }
    .badge-status { color: var(--color-foreground); min-width: 18px; }
    .badge-status .dot { width: 8px; height: 8px; border-radius: var(--radius-full); background: #22c55e; flex-shrink: 0; }
    .badge-tag { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: var(--radius-sm); padding: 2px 8px; color: var(--color-muted-foreground); min-width: 22px; }
    /* @component-css-end */
  </style>
</head>
<body>
  <div class="row">
    <span class="label">在线状态</span>
    <span class="badge badge-status" data-evidence-sample="status"><span class="dot"></span>在线玩家 42人</span>
  </div>
  <hr class="divider">
  <div class="row">
    <span class="label">标签</span>
    <span class="badge badge-tag" data-evidence-sample="tag">版本 1.21.4</span>
    <span class="badge badge-tag">play.juntingge.com</span>
  </div>
</body>
</html>
