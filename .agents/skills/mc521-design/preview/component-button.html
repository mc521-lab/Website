<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Button — 君庭阁</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin: 0; padding: 12px; background: var(--color-background); font-family: var(--font-family-base); color: var(--color-on-surface); }
.row { display: flex; gap: var(--space-3); align-items: center; margin-bottom: var(--space-2); flex-wrap: wrap; }
.label { font-size: var(--font-size-caption); color: var(--color-on-surface-variant); text-transform: uppercase; letter-spacing: .05em; min-width: 92px; flex-shrink: 0; }
.divider { border: none; border-top: 1px solid var(--color-border); margin: var(--space-3) 0; }
/* @component-css-start */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-1); border: none; cursor: pointer; font-family: var(--font-family-base); font-weight: 500; font-size: 14px; white-space: nowrap; overflow: hidden; transition: background .15s, border-color .15s; }
.btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.btn-primary { background: var(--color-primary); color: var(--color-on-primary); border-radius: var(--radius-md); height: var(--size-button-md); padding: 0 var(--space-5); min-width: var(--size-button-md); }
.btn-primary:hover { background: var(--color-primary-hover); }
.btn-primary:active { filter: brightness(.92); }
.btn-primary:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary:disabled:hover { background: var(--color-primary); filter: none; }
.btn-secondary { background: transparent; color: var(--color-primary); border: 1px solid var(--color-border); border-radius: var(--radius-md); height: var(--size-button-md); padding: 0 var(--space-5); min-width: var(--size-button-md); }
.btn-secondary:hover { background: var(--color-surface-container-low); border-color: var(--color-primary); }
.btn-secondary:active { filter: brightness(.92); }
.btn-secondary:disabled { opacity: .45; cursor: not-allowed; }
.btn-secondary:disabled:hover { background: transparent; border-color: var(--color-border); filter: none; }
.btn-ghost { background: transparent; color: var(--color-on-surface); border-radius: var(--radius-sm); height: var(--size-button-sm); padding: 0 var(--space-3); min-width: var(--size-button-sm); }
.btn-ghost:hover { background: var(--color-surface-container-low); }
.btn-ghost:active { filter: brightness(.92); }
.btn-ghost:disabled { opacity: .45; cursor: not-allowed; }
.btn-ghost:disabled:hover { background: transparent; filter: none; }
.btn-sm { height: var(--size-button-sm); min-width: var(--size-button-sm); padding: 0 var(--space-3); font-size: 12px; }
.btn-md { height: var(--size-button-md); min-width: var(--size-button-md); padding: 0 var(--space-5); }
.btn-lg { height: var(--size-button-lg); min-width: var(--size-button-lg); padding: 0 var(--space-6); font-size: 16px; }
/* @component-css-end */
</style>
</head>
<body>
<div class="row"><span class="label">Primary</span><button class="btn btn-primary btn-sm" data-evidence-sample="primary-sm">领取奖励</button><button class="btn btn-primary" data-evidence-sample="primary-md">加入QQ群</button><button class="btn btn-primary btn-lg" data-evidence-sample="primary-lg">立即开始冒险</button></div>
<div class="row"><span class="label">Secondary</span><button class="btn btn-secondary btn-sm" data-evidence-sample="secondary-sm">取消</button><button class="btn btn-secondary" data-evidence-sample="secondary-md">查看攻略</button><button class="btn btn-secondary btn-lg" data-evidence-sample="secondary-lg">创建角色</button></div>
<div class="row"><span class="label">Ghost</span><button class="btn btn-ghost" data-evidence-sample="ghost-sm">了解更多</button><button class="btn btn-ghost btn-md" data-evidence-sample="ghost-md">跳过</button><button class="btn btn-ghost btn-lg" data-evidence-sample="ghost-lg">返回首页</button></div>
<hr class="divider">
<div class="row"><span class="label">Disabled</span><button class="btn btn-primary" disabled>加入QQ群</button><button class="btn btn-secondary" disabled>查看攻略</button><button class="btn btn-ghost" disabled>了解更多</button></div>
</body>
</html>
