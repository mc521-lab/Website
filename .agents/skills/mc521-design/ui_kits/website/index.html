<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>君庭阁 Design System</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="../../components.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
/* === Page Layer ONLY — no component redefinitions === */
.uikit-shell{width:100%;max-width:1184px;margin:0 auto;overflow:hidden}
.uikit-main,.uikit-toolbar{min-width:0}
[data-component]{min-width:0;max-width:100%;overflow:hidden}
.uikit-toolbar{display:flex;align-items:center;gap:var(--space-2)}
.uikit-responsive-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-5)}
.uikit-table-wrap{max-width:100%;overflow-x:auto;overscroll-behavior-x:contain}
.uikit-truncate{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uikit-nowrap{white-space:nowrap;flex-shrink:0}
.uikit-action-cell{display:flex;align-items:center;gap:8px;min-width:0;max-width:160px;overflow:hidden}
.uikit-action{min-width:0;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:900px){.uikit-responsive-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.uikit-toolbar{flex-direction:column;align-items:stretch}.uikit-responsive-grid{grid-template-columns:minmax(0,1fr)}}

/* Page-level layout */
.page-root{background:var(--background);color:var(--foreground);font-family:var(--font-family-base);min-height:100vh;overflow-x:hidden}
.screen-tabs{display:flex;gap:var(--space-1);padding:var(--space-4) var(--space-5);background:var(--surface-dim);border-bottom:1px solid rgba(255,255,255,0.06)}
.screen-tab{padding:var(--space-2) var(--space-4);border-radius:var(--radius-full);cursor:pointer;font-size:14px;color:var(--color-on-surface-variant);background:transparent;border:none;font-family:var(--font-family-base);transition:background .15s,color .15s;white-space:nowrap}
.screen-tab:hover{background:rgba(255,255,255,0.04);color:var(--color-on-surface)}
.screen-tab.active{background:var(--color-primary);color:var(--color-on-primary)}
.screen-content{padding:var(--space-6) var(--space-5)}

/* Screen-specific layout */
.hero-section{text-align:center;padding:var(--space-8) 0 var(--space-6)}
.hero-title{font-family:var(--font-display);font-size:var(--font-size-h1);font-weight:var(--font-weight-h1);line-height:var(--line-height-h1);color:var(--color-on-surface);margin:0 0 var(--space-2)}
.hero-subtitle{font-size:var(--font-size-lead);font-weight:var(--font-weight-lead);line-height:var(--line-height-lead);color:var(--color-on-surface-variant);margin:0 0 var(--space-5)}
.hero-actions{display:flex;gap:var(--space-3);justify-content:center;align-items:center;flex-wrap:wrap}

.features-section{padding:var(--space-7) 0}
.features-section h2{font-family:var(--font-heading);font-size:var(--font-size-h2);font-weight:var(--font-weight-h2);color:var(--color-on-surface);text-align:center;margin:0 0 var(--space-6)}
.features-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-5);justify-items:center}
@media(max-width:900px){.features-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.features-grid{grid-template-columns:minmax(0,1fr)}}

.wiki-layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:var(--space-5);min-width:0}
@media(max-width:900px){.wiki-layout{grid-template-columns:minmax(0,1fr)}}
.wiki-main{min-width:0}
.wiki-header{margin-bottom:var(--space-5)}
.wiki-header h2{font-family:var(--font-heading);font-size:var(--font-size-h2);font-weight:var(--font-weight-h2);color:var(--color-on-surface);margin:0 0 var(--space-2)}
.wiki-header p{color:var(--color-on-surface-variant);margin:0;font-size:var(--font-size-body);line-height:var(--line-height-body)}
.search-row{display:flex;gap:var(--space-3);margin-bottom:var(--space-5);flex-wrap:wrap}

.status-section{margin-bottom:var(--space-7)}
.status-section h2{font-family:var(--font-heading);font-size:var(--font-size-h2);font-weight:var(--font-weight-h2);color:var(--color-on-surface);margin:0 0 var(--space-4)}
.status-bar{display:flex;gap:var(--space-4);align-items:center;flex-wrap:wrap;margin-bottom:var(--space-5)}
.server-form{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4);margin-bottom:var(--space-5)}
@media(max-width:640px){.server-form{grid-template-columns:minmax(0,1fr)}}
.form-group{display:flex;flex-direction:column;gap:var(--space-1)}
.form-group label{font-size:var(--font-size-caption);color:var(--color-muted-foreground);white-space:nowrap}
.form-actions{display:flex;gap:var(--space-3);align-items:center}

.section-divider{height:1px;background:rgba(255,255,255,0.06);margin:var(--space-7) 0}

/* Icon sizing helpers */
.icon-sm{width:var(--size-icon-sm);height:var(--size-icon-sm);display:inline-block;flex-shrink:0}
.icon-md{width:var(--size-icon-md);height:var(--size-icon-md);display:inline-block;flex-shrink:0}
.icon-lg{width:var(--size-icon-lg);height:var(--size-icon-lg);display:inline-block;flex-shrink:0}

/* Card grid overrides for showcase — wrapper only */
.card-showcase-row{display:flex;gap:var(--space-5);justify-content:center;flex-wrap:wrap}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

function App() {
  const [screen, setScreen] = useState(0);
  const screens = ['首页', '新手指南', '服务器状态'];

  return (
    <div className="page-root" data-layout-guard="uikit-v1">
      {/* Screen Tabs */}
      <div className="screen-tabs">
        {screens.map((s, i) => (
          <button key={i} className={`screen-tab${i === screen ? ' active' : ''}`} onClick={() => setScreen(i)}>{s}</button>
        ))}
      </div>

      <div className="uikit-shell">
        <div className="uikit-main">
          <div className="screen-content">
            {screen === 0 && <HomeScreen />}
            {screen === 1 && <WikiScreen />}
            {screen === 2 && <StatusScreen />}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════ SCREEN 1: 首页 ═══════════════════ */
function HomeScreen() {
  return (
    <div>
      {/* Topbar Navigation */}
      <div data-component="navigation" style={{marginBottom:'var(--space-7)'}}>
        <nav className="topbar">
          <span className="topbar-logo">君庭阁</span>
          <div className="topbar-items">
            <a className="topbar-link active" href="#">首页</a>
            <a className="topbar-link" href="#">新手指南</a>
            <a className="topbar-link" href="#">服务器状态</a>
            <a className="topbar-link" href="#">社区论坛</a>
          </div>
          <button className="topbar-cta">加入冒险</button>
        </nav>
      </div>

      {/* Hero */}
      <div className="hero-section">
        <h1 className="hero-title">二十余生，同在一片方块天</h1>
        <p className="hero-subtitle">公平 · 友好 · 长久 — 君庭阁生存服务器，等待你的到来</p>
        <div className="hero-actions">
          <button className="btn btn-primary btn-lg" data-component="button">立即开始冒险</button>
          <button className="btn btn-secondary btn-lg" data-component="button">了解更多</button>
          <button className="btn btn-ghost" data-component="button" disabled>维护中</button>
        </div>
      </div>

      {/* Feature Cards */}
      <div className="features-section">
        <h2>为什么选择君庭阁</h2>
        <div className="features-grid">
          <div className="card" data-component="card">
            <i data-lucide="shield" className="card-icon"></i>
            <h3 className="card-title">纯净生存</h3>
            <p className="card-subtitle">无付费特权，无作弊外挂，每一位冒险者都在公平的环境中探索</p>
          </div>
          <div className="card" data-component="card">
            <i data-lucide="heart-handshake" className="card-icon"></i>
            <h3 className="card-title">友好社区</h3>
            <p className="card-subtitle">热情互助的玩家群体，新手也能找到归属感</p>
          </div>
          <div className="card" data-component="card">
            <i data-lucide="clock" className="card-icon"></i>
            <h3 className="card-title">长期稳定</h3>
            <p className="card-subtitle">持续运营，存档安全有保障，你的每一座建筑都会被珍藏</p>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════ SCREEN 2: 新手指南 ═══════════════════ */
function WikiScreen() {
  return (
    <div className="wiki-layout">
      {/* Sidebar Navigation */}
      <div data-component="navigation">
        <nav className="sidebar">
          <div className="sidebar-logo">君庭阁 Wiki</div>
          <div className="sidebar-group">
            <div className="sidebar-group-label">入门</div>
            <a className="sidebar-link active" href="#">
              <i data-lucide="book-open" className="icon-sm"></i>
              <span className="uikit-truncate">新手指南</span>
            </a>
            <a className="sidebar-link" href="#">
              <i data-lucide="map" className="icon-sm"></i>
              <span className="uikit-truncate">世界介绍</span>
            </a>
            <a className="sidebar-link" href="#">
              <i data-lucide="pickaxe" className="icon-sm"></i>
              <span className="uikit-truncate">经济系统</span>
            </a>
          </div>
          <div className="sidebar-group">
            <div className="sidebar-group-label">进阶</div>
            <a className="sidebar-link" href="#">
              <i data-lucide="castle" className="icon-sm"></i>
              <span className="uikit-truncate">领地建设</span>
            </a>
            <a className="sidebar-link" href="#">
              <i data-lucide="swords" className="icon-sm"></i>
              <span className="uikit-truncate">战斗指南</span>
            </a>
            <a className="sidebar-link" href="#">
              <i data-lucide="scroll-text" className="icon-sm"></i>
              <span className="uikit-truncate">命令参考</span>
            </a>
          </div>
        </nav>
      </div>

      {/* Main Content */}
      <div className="wiki-main">
        <div className="wiki-header">
          <h2>命令参考</h2>
          <p>服务端常用命令一览，助你快速上手君庭阁</p>
        </div>

        {/* Search Input */}
        <div className="search-row" data-component="input">
          <div className="input input-search">
            <i data-lucide="search" className="search-icon"></i>
            <input className="search-field" type="text" placeholder="搜索命令或关键词..." />
            <span className="shortcut">⌘K</span>
          </div>
          <button className="btn btn-secondary btn-sm" data-component="button">筛选</button>
        </div>

        {/* Command Table */}
        <div className="uikit-table-wrap" data-component="table">
          <div className="table-wrap">
            <table className="table">
              <thead>
                <tr>
                  <th>命令</th>
                  <th>说明</th>
                  <th>权限</th>
                  <th>分类</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td><code className="jtg-mono uikit-truncate">/home</code></td>
                  <td className="uikit-truncate">传送回自己的家</td>
                  <td><span className="badge badge-tag" data-component="badge">全体玩家</span></td>
                  <td><span className="badge badge-tag" data-component="badge">传送</span></td>
                </tr>
                <tr>
                  <td><code className="jtg-mono uikit-truncate">/tpa 玩家名</code></td>
                  <td className="uikit-truncate">请求传送到指定玩家</td>
                  <td><span className="badge badge-tag" data-component="badge">全体玩家</span></td>
                  <td><span className="badge badge-tag" data-component="badge">传送</span></td>
                </tr>
                <tr>
                  <td><code className="jtg-mono uikit-truncate">/kit 新手</code></td>
                  <td className="uikit-truncate">领取新手装备包</td>
                  <td><span className="badge badge-tag" data-component="badge">全体玩家</span></td>
                  <td><span className="badge badge-tag" data-component="badge">道具</span></td>
                </tr>
                <tr>
                  <td><code className="jtg-mono uikit-truncate">/claim</code></td>
                  <td className="uikit-truncate">查看或管理领地</td>
                  <td><span className="badge badge-tag" data-component="badge">正式成员</span></td>
                  <td><span className="badge badge-tag" data-component="badge">领地</span></td>
                </tr>
                <tr>
                  <td><code className="jtg-mono uikit-truncate">/warp 市场</code></td>
                  <td className="uikit-truncate">传送到公共市场</td>
                  <td><span className="badge badge-tag" data-component="badge">全体玩家</span></td>
                  <td><span className="badge badge-tag" data-component="badge">传送</span></td>
                </tr>
                <tr>
                  <td><code className="jtg-mono uikit-truncate">/balance</code></td>
                  <td className="uikit-truncate">查询当前金币余额</td>
                  <td><span className="badge badge-tag" data-component="badge">全体玩家</span></td>
                  <td><span className="badge badge-tag" data-component="badge">经济</span></td>
                </tr>
                <tr>
                  <td><code className="jtg-mono uikit-truncate">/shop</code></td>
                  <td className="uikit-truncate">打开服务器商店界面</td>
                  <td><span className="badge badge-tag" data-component="badge">正式成员</span></td>
                  <td><span className="badge badge-tag" data-component="badge">经济</span></td>
                </tr>
                <tr>
                  <td><code className="jtg-mono uikit-truncate">/msg 玩家名</code></td>
                  <td className="uikit-truncate">发送私信给指定玩家</td>
                  <td><span className="badge badge-tag" data-component="badge">全体玩家</span></td>
                  <td><span className="badge badge-tag" data-component="badge">社交</span></td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <div className="section-divider"></div>

        {/* Interactive Card Example */}
        <div className="features-grid" style={{gridTemplateColumns:'repeat(2,minmax(0,1fr))'}}>
          <div className="card interactive" data-component="card">
            <i data-lucide="book-open" className="card-icon"></i>
            <h3 className="card-title">快速入门</h3>
            <p className="card-subtitle">从第一次登录到拥有自己的第一座小屋，只需五分钟</p>
            <a className="card-cta" href="#">开始阅读 →</a>
          </div>
          <div className="card interactive" data-component="card">
            <i data-lucide="map" className="card-icon"></i>
            <h3 className="card-title">世界地图</h3>
            <p className="card-subtitle">探索三大主城与无尽荒野，找到属于你的一方天地</p>
            <a className="card-cta" href="#">查看地图 →</a>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════ SCREEN 3: 服务器状态 ═══════════════════ */
function StatusScreen() {
  return (
    <div>
      <div className="status-section">
        <h2>服务器实时状态</h2>
        <div className="status-bar">
          <span className="badge badge-status" data-component="badge"><span className="dot"></span>在线玩家 42人</span>
          <span className="badge badge-tag" data-component="badge"><i data-lucide="server" className="icon-sm"></i>生存服</span>
          <span className="badge badge-tag" data-component="badge"><i data-lucide="box" className="icon-sm"></i>v1.20.4</span>
          <span className="badge badge-tag" data-component="badge"><i data-lucide="globe" className="icon-sm"></i>play.jtg.mc</span>
          <span className="badge badge-tag" data-component="badge"><i data-lucide="activity" className="icon-sm"></i>延迟 28ms</span>
        </div>
      </div>

      {/* Player Rankings Table */}
      <div style={{marginBottom:'var(--space-7)'}}>
        <h2 className="jtg-h3" style={{marginBottom:'var(--space-4)'}}>冒险者排行榜</h2>
        <div className="uikit-table-wrap" data-component="table">
          <div className="table-wrap">
            <table className="table">
              <thead>
                <tr>
                  <th>排名</th>
                  <th>玩家</th>
                  <th>在线时长</th>
                  <th>贡献值</th>
                  <th>状态</th>
                  <th></th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>1</td>
                  <td className="uikit-truncate">星辰旅人</td>
                  <td className="uikit-nowrap">326 小时</td>
                  <td className="uikit-nowrap">12,480</td>
                  <td><span className="badge badge-status" data-component="badge"><span className="dot"></span>在线</span></td>
                  <td className="uikit-action-cell"><button className="btn btn-ghost btn-sm" data-component="button">查看</button></td>
                </tr>
                <tr>
                  <td>2</td>
                  <td className="uikit-truncate">方舟建筑师</td>
                  <td className="uikit-nowrap">298 小时</td>
                  <td className="uikit-nowrap">11,750</td>
                  <td><span className="badge badge-status" data-component="badge" style={{opacity:.45}}><span className="dot" style={{background:'#a89279'}}></span>离线</span></td>
                  <td className="uikit-action-cell"><button className="btn btn-ghost btn-sm" data-component="button">查看</button></td>
                </tr>
                <tr>
                  <td>3</td>
                  <td className="uikit-truncate">暮色铁匠</td>
                  <td className="uikit-nowrap">271 小时</td>
                  <td className="uikit-nowrap">10,920</td>
                  <td><span className="badge badge-status" data-component="badge"><span className="dot"></span>在线</span></td>
                  <td className="uikit-action-cell"><button className="btn btn-ghost btn-sm" data-component="button">查看</button></td>
                </tr>
                <tr>
                  <td>4</td>
                  <td className="uikit-truncate">竹林隐者</td>
                  <td className="uikit-nowrap">245 小时</td>
                  <td className="uikit-nowrap">9,680</td>
                  <td><span className="badge badge-status" data-component="badge" style={{opacity:.45}}><span className="dot" style={{background:'#a89279'}}></span>离线</span></td>
                  <td className="uikit-action-cell"><button className="btn btn-ghost btn-sm" data-component="button">查看</button></td>
                </tr>
                <tr>
                  <td>5</td>
                  <td className="uikit-truncate">月下吟游</td>
                  <td className="uikit-nowrap">212 小时</td>
                  <td className="uikit-nowrap">8,540</td>
                  <td><span className="badge badge-status" data-component="badge"><span className="dot"></span>在线</span></td>
                  <td className="uikit-action-cell"><button className="btn btn-ghost btn-sm" data-component="button">查看</button></td>
                </tr>
                <tr>
                  <td>6</td>
                  <td className="uikit-truncate">雪峰猎人</td>
                  <td className="uikit-nowrap">198 小时</td>
                  <td className="uikit-nowrap">7,830</td>
                  <td><span className="badge badge-status" data-component="badge" style={{opacity:.45}}><span className="dot" style={{background:'#a89279'}}></span>离线</span></td>
                  <td className="uikit-action-cell"><button className="btn btn-ghost btn-sm" data-component="button">查看</button></td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div className="section-divider"></div>

      {/* Feedback Form */}
      <div>
        <h2 className="jtg-h3" style={{marginBottom:'var(--space-4)'}}>加入申请</h2>
        <p style={{color:'var(--color-on-surface-variant)',marginBottom:'var(--space-5)'}}>填写以下信息，管理团队将在 24 小时内审核</p>
        <div className="server-form">
          <div className="form-group">
            <label>游戏ID</label>
            <input className="input" type="text" placeholder="输入你的游戏昵称" data-component="input" />
          </div>
          <div className="form-group">
            <label>联系方式</label>
            <input className="input" type="text" placeholder="QQ号或邮箱" data-component="input" />
          </div>
          <div className="form-group">
            <label>年龄</label>
            <input className="input" type="text" placeholder="你的年龄" data-component="input" />
          </div>
          <div className="form-group">
            <label>游戏经验</label>
            <input className="input" type="text" placeholder="简述你的MC经历" data-component="input" disabled />
          </div>
        </div>
        <div className="form-actions">
          <button className="btn btn-primary" data-component="button">提交申请</button>
          <button className="btn btn-secondary" data-component="button">取消</button>
          <button className="btn btn-ghost" data-component="button">保存草稿</button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
lucide.createIcons();
</script>
</body>
</html>
